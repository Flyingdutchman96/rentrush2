<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RentRush</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Roboto', sans-serif; 
      background: #f7f9fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }
    .login-card { 
      max-width: 400px; 
      background: white; 
      border-radius: 12px; 
      box-shadow: 0 6px 18px rgba(12,23,46,0.06);
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0b74ff, #0066d6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="login-card p-4">
          <div class="text-center mb-4">
            <div class="brand-logo mx-auto mb-3">R</div>
            <h2>Welcome back</h2>
            <p class="text-muted">Sign in to your RentRush account</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control" required>
            </div>
            
            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
            <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">
              <span id="loginText">Sign In</span>
              <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
            </button>
          </form>

          <hr>
          
          <div class="text-center">
            <p class="mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
            <p class="mt-2"><a href="#" class="text-muted">Forgot password?</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      const loginText = document.getElementById('loginText');
      const loginSpinner = document.getElementById('loginSpinner');
      
      // Clear previous messages
      errorDiv.classList.add('d-none');
      successDiv.classList.add('d-none');
      
      // Show loading state
      loginText.textContent = 'Signing in...';
      loginSpinner.classList.remove('d-none');
      
      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          // Store token and user info
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));
          
          successDiv.textContent = 'Login successful! Redirecting...';
          successDiv.classList.remove('d-none');
          
          // Redirect to dashboard (we'll create this next)
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
          
        } else {
          errorDiv.textContent = result.error;
          errorDiv.classList.remove('d-none');
        }
        
      } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = 'Network error. Please check your connection.';
        errorDiv.classList.remove('d-none');
      } finally {
        // Reset loading state
        loginText.textContent = 'Sign In';
        loginSpinner.classList.add('d-none');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
